  <!-- Scripts al final del body -->

  <script>
    // Texto rotante
    const frases = [
      "Jesús te busca",
      "Me buscarán y me encontrarán cuando me busquen de todo corazón. Jeremías 29:13",
      "Creating Design and Couture",
      "¡Descubre nuestra colección! KIMONO X GOCAMEJICO",
    ];
    let idx = 0;
    const el = document.getElementById('rotText');
 
    function rotar() {
      el.classList.remove('visible');
      setTimeout(() => {
        idx = (idx + 1) % frases.length;
        el.textContent = frases[idx];
        el.classList.add('visible');
      }, 500);
    }
 
    el.classList.add('visible');
    setInterval(rotar, 3000);
 
    // Galería: mostrar sección y marcar botón activo
    function mostrar(id, btn) {
      // Ocultar todas las secciones
      ['piezas', 'colaboraciones', 'ustedes'].forEach(s => {
        document.getElementById(s).classList.add('d-none');
      });
 
      // Quitar active de todos los botones
      document.querySelectorAll('.btn-galeria').forEach(b => b.classList.remove('active'));
 
      // Mostrar la sección seleccionada
      document.getElementById(id).classList.remove('d-none');
 
      // Marcar el botón activo
      if (btn) btn.classList.add('active');
 
      // Iniciar el carrusel correspondiente si aún no está corriendo
      const carruselIds = {
        piezas: 'carruselPiezas',
        colaboraciones: 'carruselColaboraciones',
        ustedes: 'carruselUstedes'
      };
      const carruselEl = document.getElementById(carruselIds[id]);
      if (carruselEl) {
        const carrusel = bootstrap.Carousel.getOrCreateInstance(carruselEl, { ride: 'carousel' });
        carrusel.cycle();
      }
    }
  </script>
